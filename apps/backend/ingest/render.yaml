services:
  - type: worker
    name: mosaic-document-processor
    env: docker
    region: oregon
    plan: starter  # $7/mo - upgrade to standard ($25/mo) for better performance
    dockerfilePath: ./apps/backend/ingest/Dockerfile
    dockerContext: ./apps/backend/ingest
    autoDeploy: true
    branch: main  # or your default branch
    disk:
      name: temp-storage
      mountPath: /app/tmp
      sizeGB: 10  # $2.50/mo - provides 10GB for temp files
    envVars:
      - key: TMPDIR
        value: /app/tmp
      - key: PYTHON_VERSION
        value: 3.11
      - key: POLL_INTERVAL
        value: 5
      - key: BATCH_SIZE
        value: 1
      - key: MAX_RETRIES
        value: 3
      # Docling configuration
      - key: USE_API_VLM
        value: true   # Set to "true" for API VLM (GPT-4o-mini, faster)
      - key: DOCLING_MAX_WORKERS
        value: 10     # Number of pages to process in parallel (10 = ~11 min for 216 pages)
      # Add these in Render dashboard (they're secrets):
      # - SUPABASE_URL
      # - SUPABASE_SERVICE_ROLE_KEY
      # - DATABASE_URL
      # - OPENAI_API_KEY (required if USE_API_VLM=true or ENABLE_GRAPH_EXTRACTION=true)
